name: Pipeline NDVI Automático

on:
  schedule:
    - cron: '0 6 1 * *'  # El día 1 de cada mes a las 6am UTC
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install earthengine-api supabase

      - name: Autenticar Google Earth Engine
        run: |
          echo '${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}' > /tmp/gee_key.json
          earthengine authenticate --service_account_file /tmp/gee_key.json --quiet || true

      - name: Ejecutar pipeline NDVI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pipeline_ndvi.py